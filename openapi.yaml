openapi: 3.0.3
info:
  title: JTG 醫療健檢與系統管理 API 介面規範
  description: |
    JTG 系統 API OpenAPI 3.0 規範說明。
    
    ### 🔑 金鑰換取與身份驗證流程
    1. 換取 Token: 呼叫 POST /exhanceToken，帶入 api_key
       * 預設 Key: PRJFy9bRrZZbO2CtpMJN6IcOffu5ODscEp8sknwEoRsIr2kPFOu5ru96ovaJFW2d
    2. 使用 Token: 後續 API 於 Header 帶入 Authorization: Bearer <sso_token> 或於 Query/Body 帶入 sso_token
  version: 1.0.0
servers:
  - url: https://clinic.healthme.com.tw/gwapi/api
    description: 正式環境

paths:
  # ==========================================
  # 1. Token 交換 API
  # ==========================================
  /exhanceToken:
    post:
      summary: 使用者驗證與 Token 交換 API (JTG_exhanceToken)
      description: 傳入 API Key 交換 Bearer SSO Token，供後續 API 身分驗證使用。
      operationId: exchangeToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - api_key
              properties:
                who_call:
                  type: string
                  default: app
                  description: 呼叫來源標示
                api_key:
                  type: string
                  description: 存取 API 之金鑰 (密碼)
      responses:
        '200':
          description: 執行完成，傳回 Token 交換結果
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "true"
                  code:
                    type: string
                    example: "0x0200"
                  responseMessage:
                    type: string
                    example: "Token 取得成功"
                  resultData:
                    type: object
                    properties:
                      token:
                        type: string
                        example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                      type:
                        type: string
                        example: "Bearer"
                      expires_in:
                        type: integer
                        example: 86400

  # ==========================================
  # 2. 預設設備型號設定 API
  # ==========================================
  /default_device:
    get:
      summary: 查詢預設設備型號設定資料 (JTG_devselection)
      operationId: getDefaultDevices
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: sso_token
          schema:
            type: string
          description: SSO Token
        - in: query
          name: get_all
          schema:
            type: string
            enum: ["0", "1"]
            default: "0"
          description: 是否抓取全資料 (0: 僅查 status=1, 1: 查全部)
        - in: query
          name: id
          schema:
            type: integer
          description: 設備 ID
        - in: query
          name: sid
          schema:
            type: string
          description: 設備 SID
        - in: query
          name: device_type
          schema:
            type: string
          description: 設備類型
        - in: query
          name: device_name
          schema:
            type: string
          description: 設備名稱 (模糊查詢)
      responses:
        '200':
          description: 查詢成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseListDevice'

    post:
      summary: 新增或更新預設設備型號設定資料 (批次/單筆, JTG_devselection)
      operationId: insertDefaultDevice
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/DefaultDeviceInput'
                - type: array
                  items:
                    $ref: '#/components/schemas/DefaultDeviceInput'
      responses:
        '200':
          description: 處理完成
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseBatchResult'

    put:
      summary: 部分更新預設設備型號設定資料 (PUT)
      operationId: updateDefaultDevicePut
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DefaultDeviceUpdateInput'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseSingleResult'

    patch:
      summary: 部分更新預設設備型號設定資料 (PATCH)
      operationId: updateDefaultDevicePatch
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DefaultDeviceUpdateInput'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseSingleResult'

    delete:
      summary: 刪除預設設備型號設定資料
      operationId: deleteDefaultDevice
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: id
          schema:
            type: integer
          description: 目標 ID
        - in: query
          name: sid
          schema:
            type: string
          description: 目標 SID
        - in: query
          name: device_type
          schema:
            type: string
          description: 目標類型
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: integer
                sid:
                  type: string
                device_type:
                  type: string
                who_call:
                  type: string
                  default: app
      responses:
        '200':
          description: 刪除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseSingleResult'

  # ==========================================
  # 3. 機構資料 API
  # ==========================================
  /facility:
    get:
      summary: 查詢機構資料 (JTG_facility)
      operationId: getFacility
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: sso_token
          schema:
            type: string
          description: SSO Token
        - in: query
          name: id
          schema:
            type: integer
          description: 機構 ID
        - in: query
          name: sid
          schema:
            type: string
          description: 機構 SID
        - in: query
          name: facility_name
          schema:
            type: string
          description: 機構名稱 (模糊查詢)
      responses:
        '200':
          description: 查詢結果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseGeneric'

    post:
      summary: 新增機構資料 (JTG_facility)
      operationId: insertFacility
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sso_token:
                  type: string
                who_call:
                  type: string
                  default: app
      responses:
        '200':
          description: 新增結果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseGeneric'

    put:
      summary: 編輯機構資料 (PUT, JTG_facility)
      operationId: updateFacilityPut
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sso_token:
                  type: string
                who_call:
                  type: string
                  default: app
      responses:
        '200':
          description: 編輯結果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseGeneric'

    patch:
      summary: 編輯機構資料 (PATCH, JTG_facility)
      operationId: updateFacilityPatch
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sso_token:
                  type: string
                who_call:
                  type: string
                  default: app
      responses:
        '200':
          description: 編輯結果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseGeneric'

  # ==========================================
  # 4. 生理量測資料 API (JTG_measure)
  # ==========================================
  /measure:
    get:
      summary: 查詢生理量測資料 (JTG_measure)
      description: 支援依 ID, Member ID, 身分證字號, 量測類型, 時間區間等條件查詢與分頁。
      operationId: getMeasure
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: sso_token
          schema:
            type: string
        - in: query
          name: id
          schema:
            type: integer
          description: 量測記錄 ID
        - in: query
          name: member_id
          schema:
            type: integer
          description: 會員系統 ID
        - in: query
          name: personal_id
          schema:
            type: string
          description: 會員身分證號碼
        - in: query
          name: type
          schema:
            type: string
          description: 量測類型 (如 blood_pressure, blood_sugar, body_weight 等)
        - in: query
          name: start_time
          schema:
            type: string
            format: date-time
          description: 量測開始時間 (YYYY-MM-DD HH:mm:ss)
        - in: query
          name: end_time
          schema:
            type: string
            format: date-time
          description: 量測結束時間 (YYYY-MM-DD HH:mm:ss)
        - in: query
          name: page
          schema:
            type: integer
            default: 1
          description: 頁碼
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
          description: 每頁筆數
      responses:
        '200':
          description: 查詢成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseListMeasure'

    post:
      summary: 新增生理量測資料 (JTG_measure)
      operationId: insertMeasure
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/MeasureInput'
                - type: array
                  items:
                    $ref: '#/components/schemas/MeasureInput'
      responses:
        '200':
          description: 新增成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseSingleResult'

    put:
      summary: 更新生理量測資料 (PUT, JTG_measure)
      operationId: updateMeasurePut
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MeasureUpdateInput'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseSingleResult'

    patch:
      summary: 部分更新生理量測資料 (PATCH, JTG_measure)
      operationId: updateMeasurePatch
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MeasureUpdateInput'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseSingleResult'

    delete:
      summary: 刪除生理量測資料 (JTG_measure)
      operationId: deleteMeasure
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: id
          schema:
            type: integer
          description: 量測記錄 ID
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: integer
                who_call:
                  type: string
                  default: app
      responses:
        '200':
          description: 刪除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseSingleResult'

  # ==========================================
  # 5. 生理量測檔案 API (JTG_measure4file2)
  # ==========================================
  /measure4file2:
    get:
      summary: 查詢量測關聯檔案 (JTG_measure4file2)
      description: 查詢心電圖、超音波等量測附件檔案記錄。
      operationId: getMeasureFile
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: sso_token
          schema:
            type: string
        - in: query
          name: id
          schema:
            type: integer
          description: 檔案記錄 ID
        - in: query
          name: measure_id
          schema:
            type: integer
          description: 關聯之量測記錄 ID
        - in: query
          name: member_id
          schema:
            type: integer
          description: 會員系統 ID
        - in: query
          name: file_type
          schema:
            type: string
          description: 檔案類型 (如 pdf, png, ecg 等)
      responses:
        '200':
          description: 查詢成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseListMeasureFile'

    post:
      summary: 新增/上傳量測關聯檔案 (JTG_measure4file)
