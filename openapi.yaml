            schema:
              $ref: '#/components/schemas/MeasureFileUpdateInput'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseSingleResult'

    patch:
      summary: 部分更新量測關聯檔案資訊 (PATCH, JTG_measure4file)
      operationId: updateMeasureFilePatch
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MeasureFileUpdateInput'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseSingleResult'

    delete:
      summary: 刪除量測關聯檔案記錄 (JTG_measure4file)
      operationId: deleteMeasureFile
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: id
          schema:
            type: integer
          description: 檔案記錄 ID
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: integer
                who_call:
                  type: string
                  default: app
      responses:
        '200':
          description: 刪除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseSingleResult'

  # ==========================================
  # 6. 會員/個案資料 API (JTG_member)
