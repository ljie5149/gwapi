              schema:
                $ref: '#/components/schemas/ApiResponseSingleResult'

    put:
      summary: 更新量測關聯檔案資訊 (PUT, JTG_measure4file)
      operationId: updateMeasureFilePut
      security:
        - bearerAuth: []
      requestBody:
        required: true
