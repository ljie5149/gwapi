          application/json:
            schema:
              type: object
              properties:
                id:
                  type: integer
                who_call:
                  type: string
                  default: app
      responses:
        '200':
          description: 刪除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseSingleResult'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 請於 Header 中傳遞 `Authorization: Bearer <SSO_TOKEN>`

  schemas:
    # ------------------------------------------
    # 預設設備 Schemas
    # ------------------------------------------
    DefaultDeviceInput:
      type: object
      required:
        - sid
        - device_type
        - device_name
      properties:
        sso_token:
          type: string
        who_call:
          type: string
          default: app
        sid:
          type: string
        device_type:
          type: string
        device_name:
          type: string
        receive_mode:
          type: string
          nullable: true
        tag:
          type: string
          nullable: true
        baudrate:
          type: integer
          default: 9600
        data_bits:
          type: integer
          default: 8
        parity:
          type: string
          default: NONE
        stop_bit:
          type: string
          default: "1"
        handshake:
          type: string
          default: NONE
        hk:
          type: string
          nullable: true
        status:
          type: integer
          default: 1
        sort_order:
          type: integer
          default: 0
        remark:
          type: string
          nullable: true

    DefaultDeviceUpdateInput:
      type: object
      properties:
        sso_token:
          type: string
        who_call:
          type: string
          default: app
        id:
          type: integer
        sid:
          type: string
        device_type:
          type: string
        device_name:
          type: string
        receive_mode:
          type: string
        tag:
          type: string
        baudrate:
          type: integer
        data_bits:
          type: integer
        parity:
          type: string
        stop_bit:
          type: string
        handshake:
